[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app-core",
    "crates/engine-host",
    "crates/filesystem",
    "crates/secure-store",
    "packages/contracts/rust",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.metadata.teratai]
tauri-version = "2.x"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
teratai-contracts = { path = "packages/contracts/rust" }
tauri = "=2.11.2"
tauri-build = "=2.6.2"
