[project]
name = "teratai-analytics-workspace"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.uv.workspace]
members = ["engine"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["engine"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/teratai_engine", "engine/tests", "tests/golden"]
explicit_package_bases = true
mypy_path = "engine"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["engine/tests", "tests/golden"]
pythonpath = ["engine"]
